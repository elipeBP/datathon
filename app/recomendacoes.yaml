nota: >-
  Versão reescrita pela equipe a partir do rascunho automático (src/recomendacoes.py), em 11/11/2026.
  Mudanças: as duas candidatas do Oeste (São Miguel do Oeste e Concórdia) viraram uma só, por mesorregião;
  a ação deixou de ser "formação" para quem já é qualificado e pede para sair; a 3ª vaga foi para Blumenau,
  o maior volume do têxtil. O pipeline não sobrescreve este arquivo enquanto status_geral = aprovada.
